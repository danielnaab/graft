apiVersion: kb/v1
name: api-catalog-example
description: "API catalog using metadata + views strategy - items with frontmatter, queryable index."

entrypoints:
  human: docs/README.md
  agent: AGENTS.md

meta:
  entrypoint: "https://github.com/danielnaab/knowledge-base-kit/blob/main/README.md"

imports:
  - kind: git
    repo: https://github.com/danielnaab/knowledge-base-kit.git
    ref: main
    entrypoint: knowledge-base.yaml

paths:
  docs: docs
  apis: apis

rules:
  lifecycle:
    statuses: ["draft", "working", "stable", "deprecated"]
  provenance:
    requiredFor: ["factual-claims"]
  writes:
    allow: ["docs/**", "apis/**"]
    deny: ["secrets/**"]

metadata:
  schema:
    apis:
      required: ["status", "tags"]
      status: ["draft", "working", "stable", "deprecated"]
      tags: ["core", "billing", "legacy", "internal"]
