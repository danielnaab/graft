apiVersion: kb/v1
name: meal-planner-example
description: "Meal planning and grocery helper KB using canonical data + source-first synthesis."

entrypoints:
  human: docs/README.md
  agent: AGENTS.md

meta:
  entrypoint: "https://github.com/danielnaab/knowledge-base-kit/blob/main/README.md"

imports:
  - kind: git
    repo: https://github.com/danielnaab/knowledge-base-kit.git
    ref: main
    entrypoint: knowledge-base.yaml

paths:
  docs: docs
  notes: notes
  data: data

sources:
  canonical:
    - path: data/pantry.yaml
      note: "Pantry inventory is canonical."
    - path: data/recipes/**
      note: "Recipes are canonical."

rules:
  lifecycle:
    statuses: ["draft", "working", "stable", "deprecated"]
  provenance:
    requiredFor: ["factual-claims", "operational-guidance"]
  writes:
    allow: ["docs/**", "notes/**", "data/**"]
    deny: ["secrets/**"]
