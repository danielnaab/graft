# graft's upgrade bot, run by the repo itself: weekly, move scions pinned to a tag to the newest
# tag upstream, and propose the change as a PR from the branch graft/upgrade. Nothing is pushed
# to the default branch: review and merge are yours. Copy to .forgejo/workflows/.
name: graft-upgrade
on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC
  workflow_dispatch:

concurrency:
  group: graft-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: nixos-latest
    timeout-minutes: 30
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
      BRANCH: graft/upgrade
      LOG: /tmp/graft-upgrade.log   # outside the checkout: steps share the job's container
    steps:
      - name: Checkout the default branch
        env:
          SERVER: ${{ github.server_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "$REPO_URL.git"
          # The token is for this server only (scoped), never for the providers graft-upgrade asks.
          git config "http.$SERVER/.extraheader" "Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git fetch -q --no-tags origin "$REF"
          git checkout -q --force -B "$BRANCH" FETCH_HEAD

      - name: Upgrade
        id: upgrade
        run: |
          set -euo pipefail
          nix run .#graft-upgrade | tee "$LOG"
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check the result
        if: steps.upgrade.outputs.changed == 'true'
        run: |
          set -euo pipefail
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build --no-link ".#checks.$system.graft"

      - name: Push and open (or update) the PR
        if: steps.upgrade.outputs.changed == 'true'
        env:
          WEB: ${{ github.server_url }}/${{ github.repository }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          # The job token can push, but Forgejo (through 11 at least) refuses it when opening a PR
          # on a private repo. A user's token, in the Actions secret GRAFT_PR_TOKEN (set it once for
          # all your repos under Settings > Actions > Secrets), opens the PR as that user.
          PR_TOKEN: ${{ secrets.GRAFT_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          changes=$(grep '^graft: .* -> ' "$LOG")
          git -c user.name="graft-upgrade" -c user.email="graft-upgrade@noreply.invalid" \
            commit -q -m "graft: upgrade scions" -m "$changes"
          git push -q --force origin "$BRANCH"

          jq=$(nix build --no-link --print-out-paths nixpkgs#jq.bin)/bin/jq
          api() { curl -sS -w '\n%{http_code}' -H "Authorization: token $PR_TOKEN" -H "Content-Type: application/json" "$@"; }
          out=$(api "$API/pulls?state=open&limit=50"); code=${out##*$'\n'}; out=${out%$'\n'*}
          [ "$code" = 200 ] || { echo "::error::listing PRs: HTTP $code"; exit 1; }
          if [ "$("$jq" --arg b "$BRANCH" '[.[] | select(.head.ref == $b)] | length' <<<"$out")" != 0 ]; then
            echo "PR already open for $BRANCH: updated by the push"; exit 0
          fi
          list=""
          while IFS= read -r line; do list+="- ${line#graft: }"$'\n'; done <<<"$changes"
          body="Scions behind their upstream's newest tag, moved by \`nix run .#graft-upgrade\`:"$'\n\n'"$list"$'\n'
          body+="\`nix flake check\` passed on the result. The diff of the scions directory is the change you are taking; review and merge are yours."
          out=$("$jq" -n --arg head "$BRANCH" --arg base "$BASE" --arg body "$body" \
              '{head: $head, base: $base, title: "graft: upgrade scions", body: $body}' | api -X POST -d @- "$API/pulls")
          code=${out##*$'\n'}; out=${out%$'\n'*}
          if [ "$code" = 201 ]; then "$jq" -r .html_url <<<"$out"; exit 0; fi
          echo "::error::opening the PR: HTTP $code. $BRANCH is pushed; open it at $WEB/compare/$BASE...$BRANCH"
          [ "$code" != 404 ] || echo "::error::a 404 here is Forgejo refusing the job token: set the GRAFT_PR_TOKEN secret"
          exit 1
