# graft's upgrade bot, run by the repo itself: weekly, move scions pinned to a tag to the newest
# tag upstream, and propose the change as a PR from the branch graft/upgrade. Nothing is pushed
# to the default branch: review and merge are yours. Copy to .forgejo/workflows/.
name: graft-upgrade
on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC
  workflow_dispatch:

concurrency:
  group: graft-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: nixos-latest
    timeout-minutes: 30
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
      BRANCH: graft/upgrade
    steps:
      - name: Checkout the default branch
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "$REPO_URL.git"
          git config http.extraheader "Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git fetch -q --no-tags origin "$REF"
          git checkout -q --force -B "$BRANCH" FETCH_HEAD

      - name: Upgrade
        id: upgrade
        run: |
          set -euo pipefail
          nix run .#graft-upgrade | tee upgrade.log
          git add -A -- . ':!upgrade.log'
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check the result
        if: steps.upgrade.outputs.changed == 'true'
        run: |
          set -euo pipefail
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build --no-link ".#checks.$system.graft"

      - name: Push and open (or update) the PR
        if: steps.upgrade.outputs.changed == 'true'
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c user.name="graft-upgrade" -c user.email="graft-upgrade@noreply.invalid" \
            commit -q -m "graft: upgrade scions" -m "$(grep '^graft: .* -> ' upgrade.log)"
          git push -q --force origin "$BRANCH"
          nix shell nixpkgs#jq nixpkgs#curl --command bash -euo pipefail -c '
            open=$(curl -fsS -H "Authorization: token $TOKEN" "$API/pulls?state=open&limit=50" \
              | jq --arg b "$BRANCH" "[.[] | select(.head.ref == \$b)] | length")
            if [ "$open" != 0 ]; then echo "PR already open for $BRANCH: updated by the push"; exit 0; fi
            body=$(printf "%s\n\n%s\n\n%s" "Scions behind their upstream'\''s newest tag, moved by \`nix run .#graft-upgrade\`:" \
              "$(grep "^graft: .* -> " upgrade.log | sed "s/^graft: /- /")" \
              "\`nix flake check\` passed on the result. The diff of the scions directory is the change you are taking; review and merge are yours.")
            jq -n --arg head "$BRANCH" --arg base "$BASE" --arg body "$body" \
              "{head: \$head, base: \$base, title: \"graft: upgrade scions\", body: \$body}" \
              | curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" -d @- "$API/pulls" \
              | jq -r .html_url'
