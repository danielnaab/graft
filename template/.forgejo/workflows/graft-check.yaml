# managed by graft: https://github.com/danielnaab/graft (delete this line to keep your own edits)
# graft's integrity check: the scions directory, and graft's workflows, match flake.lock's pins.
# Copy to .forgejo/workflows/. The step itself is `nix run .#graft ci check` (graft's lib/ci.sh)
# at the graft version the repo pins, and `graft upgrade` replaces this file with the copy each new
# version ships, as long as the line above is here.
name: graft-check
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: graft-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scions:
    # Any runner with Nix. On Forgejo, a docker label for docker://nixos/nix keeps this off
    # host runners; its jobs are short (a fetch and a diff).
    runs-on: nixos-latest
    timeout-minutes: 20
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
    steps:
      - name: Checkout
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "$REPO_URL.git"
          git -c "http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --no-tags --depth=1 origin "$SHA"
          git checkout -q --force --detach "$SHA"

      - name: Scions match flake.lock
        run: |
          # graft's flake: at the top, or where the scions READMEs record it (mkFlake's flakeDir), by
          # graft's rules (lib/common.sh, recorded_flake_dir): only a README carrying graft's marker,
          # not one inside another (a provider's leaked scions README), every one naming the same
          # plain relative path. Bash and git only: the nixos/nix image has no sed.
          ds=() fd=""
          while IFS= read -r f; do ds+=("${f%README.md}"); done \
            < <(git grep -l -F -e '<!-- managed by graft: https://github.com/danielnaab/graft -->' -e 'Managed by [graft]' -- README.md '*/README.md' || true)
          for d in "${ds[@]}"; do
            [ -n "$d" ] || continue
            for o in "${ds[@]}"; do if [ -n "$o" ] && [ "$o" != "$d" ] && [[ $d == "$o"* ]]; then continue 2; fi; done
            while IFS= read -r l; do
              case $l in '<!-- graft flake: '*' -->') l=${l#'<!-- graft flake: '} && l=${l%' -->'} ;; *) continue ;; esac
              if [ -n "$fd" ] && [ "$fd" != "$l" ]; then echo "::error::the scions READMEs name different flake directories: $fd $l"; exit 1; fi
              fd=$l
            done < "${d}README.md"
          done
          if [ -n "$fd" ] && { [[ ! $fd =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] || [[ $fd =~ (^|/)\.\.?(/|$) ]]; }; then
            echo "::error::the scions README names a flake directory graft won't use: $fd"; exit 1
          fi
          flake=.; if [ -n "$fd" ]; then flake=path:$PWD/$fd; fi
          nix run "$flake#graft" ci check
